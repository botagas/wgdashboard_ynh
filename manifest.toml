#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "wgdashboard"
name = "WGDashboard"
description.en = "A WireGuard Dashboard for more control"

version = "4.3.0.1~ynh1"

maintainers = ["botagas"]

[upstream]
license = "GPL-3.0-or-later"
website = "https://wgdashboard.dev"
code = "https://github.com/donaldzou/WGDashboard"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"
    optional = true

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/WGDashboard/WGDashboard/archive/refs/tags/v4.3.0.1.tar.gz"
    sha256 = "e0620904073a4daa52966041efb0d483da7780dc95cec5b90e9f1bc7235c1cbd"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]
    home = "/var/www/wgdashboard"

    [resources.install_dir]
    dir = "/var/www/wgdashboard"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main_tcp.default = 10086
    main_udp.default = 51820
    main_udp.exposed = "UDP"

    [resources.apt]
    packages = ["wireguard", "wireguard-tools", "net-tools", "python3-venv", "python3-dev", "python3-pip"]
    packages_from_raw_bash = """
    if dpkg --compare-versions $(uname -r) lt 5.6; then
        echo wireguard-dkms linux-headers-$(uname -r)
    fi
    """
